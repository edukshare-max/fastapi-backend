services:
  - type: web
    name: sasu-multitenant-staging
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: staging
      - key: ENABLE_MULTITENANT_ROUTES
        value: "true"
      - key: ENABLE_LEGACY_ROUTES
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: COSMOS_DATABASE_NAME
        value: sasu_multitenant_staging
      - key: ALLOW_PRODUCTION_DATABASE
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COSMOS_ENDPOINT
        sync: false
      - key: COSMOS_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: LOGIN_RATE_LIMIT
        value: "10"
